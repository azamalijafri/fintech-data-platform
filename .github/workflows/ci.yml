name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate stack & dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dbt CLI
        run: pip install dbt-core dbt-snowflake

      - name: Validate dbt project compiles
        working-directory: dbt
        run: dbt parse --profiles-dir .
        env:
          SNOWFLAKE_ACCOUNT: dummy
          SNOWFLAKE_USER: dummy
          SNOWFLAKE_PASSWORD: dummy
          SNOWFLAKE_ROLE: dummy
          SNOWFLAKE_DATABASE: FINTECH
          SNOWFLAKE_WAREHOUSE: dummy
          SNOWFLAKE_SCHEMA: RAW

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          docker compose -f infra/docker/docker-compose.yml config --quiet
          docker compose -f infra/docker/docker-compose.yml --profile orchestrate config --quiet
