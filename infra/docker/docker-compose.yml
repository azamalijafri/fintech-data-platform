name: fintech-data-platform

# Single platform stack. Services are grouped by purpose:
#   - ingest:      Kafka broker + producer + consumer
#   - orchestrate: Apache Airflow (metadata DB, scheduler, api-server, dag-processor)
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up -d            # everything
#   docker compose -f infra/docker/docker-compose.yml up -d kafka      # ingest only
#   docker compose -f infra/docker/docker-compose.yml up -d airflow-api-server # orchestration only

services:
  # ------------------------------------------------------------------
  # INGEST LAYER
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.1
    container_name: fintech-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - fintech-network

  producer:
    build:
      context: ../..
      dockerfile: services/ingest/producer/Dockerfile
    container_name: fintech-producer

    env_file:
      - ../../.env

    volumes:
      - ../../data:/data:ro

    depends_on:
      - kafka

    networks:
      - fintech-network

  consumer:
    build:
      context: ../..
      dockerfile: services/ingest/consumer/Dockerfile
    container_name: fintech-consumer

    env_file:
      - ../../.env

    depends_on:
      - kafka

    networks:
      - fintech-network

    volumes:
      - ~/.aws:/root/.aws:ro

  # ------------------------------------------------------------------
  # ORCHESTRATION LAYER (Apache Airflow 3)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: fintech-airflow-postgres
    profiles: ["orchestrate"]

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    networks:
      - fintech-network

  airflow-init:
    build:
      context: ../../services/orchestrator
      dockerfile: Dockerfile
    container_name: fintech-airflow-init
    profiles: ["orchestrate"]
    env_file:
      - ../../.env

    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin

    volumes:
      - ../../services/orchestrator/dags:/opt/airflow/dags
      - ../../services/orchestrator/logs:/opt/airflow/logs
      - ../../services/orchestrator/plugins:/opt/airflow/plugins
      - ../../dbt:/opt/airflow/dbt

    command: airflow db migrate

    networks:
      - fintech-network

  airflow-api-server:
    build:
      context: ../../services/orchestrator
      dockerfile: Dockerfile
    container_name: fintech-airflow-api-server
    profiles: ["orchestrate"]
    env_file:
      - ../../.env

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__API_AUTH__JWT_SECRET: shared-fintech-airflow-jwt-secret

    volumes:
      - ../../services/orchestrator/dags:/opt/airflow/dags
      - ../../services/orchestrator/logs:/opt/airflow/logs
      - ../../services/orchestrator/plugins:/opt/airflow/plugins
      - ../../dbt:/opt/airflow/dbt

    ports:
      - "8080:8080"

    command: api-server

    networks:
      - fintech-network

  airflow-dag-processor:
    build:
      context: ../../services/orchestrator
      dockerfile: Dockerfile
    container_name: fintech-airflow-dag-processor
    profiles: ["orchestrate"]

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: dag-processor

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__API_AUTH__JWT_SECRET: shared-fintech-airflow-jwt-secret

    volumes:
      - ../../services/orchestrator/dags:/opt/airflow/dags
      - ../../services/orchestrator/logs:/opt/airflow/logs
      - ../../services/orchestrator/plugins:/opt/airflow/plugins
      - ../../dbt:/opt/airflow/dbt

    networks:
      - fintech-network

  airflow-scheduler:
    build:
      context: ../../services/orchestrator
      dockerfile: Dockerfile
    container_name: fintech-airflow-scheduler
    profiles: ["orchestrate"]
    env_file:
      - ../../.env

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: shared-fintech-airflow-jwt-secret

    volumes:
      - ../../services/orchestrator/dags:/opt/airflow/dags
      - ../../services/orchestrator/logs:/opt/airflow/logs
      - ../../services/orchestrator/plugins:/opt/airflow/plugins
      - ../../dbt:/opt/airflow/dbt

    command: scheduler

    networks:
      - fintech-network

volumes:
  airflow-postgres-data:

networks:
  fintech-network:
    external: true
