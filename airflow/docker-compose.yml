services:

  postgres:
    image: postgres:16
    container_name: fintech-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    networks:
      - fintech-network


  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-airflow-init
    env_file:
      - ../.env

    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../fintech_data_platform:/opt/airflow/dbt

    command: airflow db migrate

    networks:
      - fintech-network


  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-airflow-api-server
    env_file:
      - ../.env

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../fintech_data_platform:/opt/airflow/dbt

    ports:
      - "8080:8080"

    command: api-server

    networks:
      - fintech-network


  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-airflow-dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: dag-processor

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../fintech_data_platform:/opt/airflow/dbt

    networks:
      - fintech-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-airflow-scheduler
    env_file:
      - ../.env

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../fintech_data_platform:/opt/airflow/dbt

    command: scheduler

    networks:
      - fintech-network


volumes:
  airflow-postgres-data:


networks:
  fintech-network:
    external: true
